<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <style>
    :root {
      --text: #22201d;
      --muted: #7d786f;
      --link: #1651a0;
      --bg: #faf9f6;
      --rule: #e8e5df;
      --code-bg: #f1efe9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #d9d6d0;
        --muted: #918c84;
        --link: #92b4e3;
        --bg: #161513;
        --rule: #2c2a26;
        --code-bg: #211f1c;
      }
    }
    * { box-sizing: border-box; }
    html { height: 100%; }
    body {
      min-height: 100%;
      margin: 0 auto;
      padding: 3rem 1.25rem 2rem;
      max-width: 41rem;
      display: flex;
      flex-direction: column;
      font: 18px/1.7 Georgia, 'Times New Roman', serif;
      color: var(--text);
      background: var(--bg);
      text-rendering: optimizeLegibility;
    }
    a {
      color: var(--link);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      text-decoration-color: color-mix(in srgb, var(--link) 35%, transparent);
    }
    a:hover { text-decoration-color: var(--link); }
    header.site {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 3rem;
    }
    header.site .name {
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--text);
      text-decoration: none;
    }
    header.site .name:hover { text-decoration: underline; }
    header.site nav {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    header.site nav a { color: var(--muted); text-decoration: none; }
    header.site nav a:hover { color: var(--text); }
    header.site nav .sep {
      width: 1px;
      height: 0.9rem;
      background: var(--rule);
    }
    header.site nav .icon { display: flex; }
    header.site nav svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      transition: color 0.15s;
    }
    main { flex: 1; }
    h1, h2, h3 { line-height: 1.3; }
    article h1 { font-size: 1.7rem; margin: 0 0 0.35rem; }
    article h2 { font-size: 1.3rem; margin: 2.25rem 0 0.5rem; }
    article h3 { font-size: 1.15rem; margin: 1.75rem 0 0.4rem; }
    article > time {
      display: block;
      margin-bottom: 2rem;
      font: 0.85rem ui-monospace, 'SF Mono', Menlo, monospace;
      color: var(--muted);
    }
    article p, article li { max-width: 38rem; }
    time, .muted { color: var(--muted); }
    hr { border: 0; border-top: 1px solid var(--rule); margin: 2.5rem 0; }
    pre {
      padding: 0.85rem 1rem;
      overflow-x: auto;
      background: var(--code-bg);
      border: 1px solid var(--rule);
      border-radius: 6px;
    }
    code { font: 0.85em/1.6 ui-monospace, 'SF Mono', Menlo, monospace; }
    blockquote {
      margin: 0;
      padding-left: 1rem;
      border-left: 3px solid var(--rule);
      color: var(--muted);
    }
    img { max-width: 100%; }
    .intro {
      margin: 0 0 2.5rem;
      color: var(--muted);
      font-style: italic;
    }
    ul.posts { list-style: none; padding: 0; margin: 0; }
    ul.posts li {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      padding: 0.45rem 0;
      border-bottom: 1px solid var(--rule);
    }
    ul.posts li:last-child { border-bottom: 0; }
    ul.posts time {
      flex: none;
      font: 0.8rem ui-monospace, 'SF Mono', Menlo, monospace;
    }
    ul.posts a { color: var(--text); text-decoration: none; }
    ul.posts a:hover { color: var(--link); text-decoration: underline; }
    footer.site {
      margin-top: 4rem;
      padding-top: 1rem;
      border-top: 1px solid var(--rule);
      font-size: 0.85rem;
      color: var(--muted);
    }
    footer.site a { color: var(--muted); }
  </style>
</head>
<body>
  <header class="site">
    <a class="name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/about/' | relative_url }}">about</a>
      <span class="sep" aria-hidden="true"></span>
      {% if site.github_username %}
      <a class="icon" href="https://github.com/{{ site.github_username }}" aria-label="GitHub" title="GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
      </a>
      {% endif %}
      {% if site.linkedin_username %}
      <a class="icon" href="https://www.linkedin.com/in/{{ site.linkedin_username }}" aria-label="LinkedIn" title="LinkedIn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
      {% endif %}
      <a class="icon" href="{{ '/feed.xml' | relative_url }}" aria-label="RSS feed" title="RSS feed">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.503 20.752c0 1.794-1.456 3.248-3.251 3.248-1.796 0-3.252-1.454-3.252-3.248 0-1.794 1.456-3.248 3.252-3.248 1.795.001 3.251 1.454 3.251 3.248zM0 8.18v4.811c6.05.062 10.96 4.966 11.022 11.009h4.817C15.777 15.29 8.721 8.242 0 8.18zm0-3.368c10.58.046 19.152 8.594 19.183 19.188H24C23.97 10.769 13.245.046 0 0v4.812z"/></svg>
      </a>
    </nav>
  </header>
  <main>
  {{ content }}
  </main>
  <footer class="site">
    &copy; {{ 'now' | date: "%Y" }} {{ site.author }} &middot; <a href="{{ '/feed.xml' | relative_url }}">rss</a>
  </footer>
</body>
</html>
